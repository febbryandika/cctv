# MediaMTX + Postgres + a fake camera (docs/ARCHITECTURE.md#the-media-pipeline).
#
# Development cannot depend on a physical camera being powered on, and CI
# certainly cannot. `docker compose stop fakecam` produces a real recording
# gap, which is how the timeline gets tested without unplugging anything.
#
# The obvious setup is `network_mode: host`. That only works on Linux — on
# macOS and Windows the container shares the Docker VM's network namespace, not
# the host's, so every port binds somewhere the developer's machine cannot
# reach. Ports are published explicitly instead, each one to 127.0.0.1 so the
# loopback guarantee (docs/ARCHITECTURE.md#the-trust-boundary) is preserved
# rather than merely relocated.

services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    restart: unless-stopped
    # mediamtx.yml is GENERATED and gitignored (it embeds a password hash), so
    # on a fresh clone it does not exist and Compose would helpfully create a
    # DIRECTORY at that path — MediaMTX would then find no config and start on
    # its defaults: HLS on, RTMP on, nothing recorded, nothing bound to
    # loopback. Two guards, because neither is sufficient alone:
    #
    #   create_host_path: false  stops Compose creating the directory, so `up`
    #     fails on the mount. Documented, but ignored by some backends
    #     (docker/compose#13602), so it is the nice failure, not the guarantee.
    #
    #   command: ['/mediamtx.yml']  names the config explicitly. MediaMTX
    #     tolerates a missing config only when no path is given; an explicit
    #     path that cannot be read is fatal. That is the guarantee.
    #
    # Render it first:  cd apps/api && bun run render:mediamtx
    command: ['/mediamtx.yml']
    environment:
      # mediamtx.yml gives `yard` a pull source (the real camera), but the
      # fakecam below PUBLISHES to that same path, and a path cannot do both.
      # MediaMTX lets any config key be overridden by an MTX_-prefixed
      # variable, so development flips the source without editing the file.
      # Set MTX_PATHS_YARD_SOURCE to the camera URL in .env to pull instead.
      MTX_PATHS_YARD_SOURCE: ${MTX_PATHS_YARD_SOURCE:-publisher}
    ports:
      - '127.0.0.1:8554:8554/tcp' # RTSP  — TCP only, see rtspTransports
      - '127.0.0.1:8889:8889/tcp' # WebRTC/WHEP signalling
      - '127.0.0.1:8189:8189/udp' # WebRTC ICE — media, not signalling
      - '127.0.0.1:9997:9997/tcp' # control API
      - '127.0.0.1:9996:9996/tcp' # playback API
    volumes:
      - type: bind
        source: ./mediamtx.yml
        target: /mediamtx.yml
        read_only: true
        bind:
          create_host_path: false
      - ./recordings:/recordings

  # Same engine and major version Neon runs, so migrations behave identically.
  # This pin tracks Neon — check with `select version()` against the Neon
  # branch and bump both together; a local 17 against a hosted 18 means a
  # migration can pass here and fail there.
  #
  # Development stays possible with no internet; point DATABASE_URL at Neon when
  # you want the hosted one (docs/ARCHITECTURE.md#data).
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ronda
      POSTGRES_PASSWORD: ronda
      POSTGRES_DB: ronda
    ports:
      # 5432 on the host, not in the container: a natively-installed Postgres
      # commonly owns the standard port, and plain `lsof` will not show it if
      # it belongs to another user — check with `netstat -an | grep 5432`.
      # DATABASE_URL in .env.example matches this.
      - '127.0.0.1:5439:5432'
    # NOT /var/lib/postgresql/data. The 18+ images store data in a subdirectory
    # of /var/lib/postgresql so that `pg_upgrade --link` does not straddle a
    # mount boundary, and they refuse to start if the old path is mounted
    # instead — "in 18+, these Docker images are configured to store database
    # data in a ...". See docker-library/postgres#37.
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ronda -d ronda']
      interval: 5s
      timeout: 3s
      retries: 10

  # The fixture must already be H.264 so `-c copy` works — no transcode,
  # negligible CPU, and the stream behaves like a real camera.
  #
  # Publishes to `mediamtx` by service name, not 127.0.0.1: without host
  # networking each container has its own loopback. `-rtsp_transport tcp`
  # because the server is TCP-only (ffmpeg's RTSP muxer defaults to UDP).
  fakecam:
    image: linuxserver/ffmpeg:latest
    restart: unless-stopped
    depends_on: [mediamtx]
    volumes: [./apps/api/fixtures:/fixtures]
    command: >
      -re -stream_loop -1 -i /fixtures/yard-loop.mp4
      -c copy -f rtsp -rtsp_transport tcp rtsp://mediamtx:8554/yard

volumes:
  pgdata:

# Pinned so mediamtx.yml can name it in authInternalUsers. Requests arriving
# through a published port come from this network, not from loopback.
networks:
  default:
    ipam:
      config:
        - subnet: 172.31.255.0/24

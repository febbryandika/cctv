# Ronda media pipeline (SPEC 7).
#
# MediaMTX owns the entire media path: it pulls RTSP from the camera, records
# fMP4 segments to disk, serves WebRTC/WHEP for live, and stitches recorded
# windows by wall-clock time. The application code owns only authentication,
# timeline arithmetic, and honesty about what was actually recorded.

logLevel: info

# Bind everything to loopback. The Hono API is the only way in, so auth cannot
# be bypassed by hitting a port directly (SPEC 15).
rtspAddress: 127.0.0.1:8554
webrtcAddress: 127.0.0.1:8889
apiAddress: 127.0.0.1:9997
playbackAddress: 127.0.0.1:9996

api: yes
playback: yes

# Every protocol this project does not use is turned off, not just left
# unbound. SPEC 7 pins the four addresses above, but a MediaMTX left otherwise
# at its defaults also serves RTMP on :1935, SRT on :8890 and MoQ on
# :8892-8893 — on every interface. Each of those is a complete, unauthenticated
# way to read `yard` from anywhere on the LAN, which is exactly what SPEC 15
# says must not exist. `hls: no` was already specified for a different reason
# (SPEC 1.3); the rest follow the same logic.
hls: no
rtmp: no
srt: no
moq: no

# Deliberately left alone: RTSP still binds UDP/RTP on :8000-8001 and WebRTC
# still binds UDP/ICE on :8189, both on every interface. Neither is an
# independent read path — RTSP media requires a session negotiated over the
# loopback-bound control port, and WebRTC media requires an ICE credential
# exchanged during WHEP signalling, which only the authenticated API can reach.
# Pinning them to loopback would also confine live view to a browser running on
# this machine, which is a build-order step 5 decision, not a step 0 one.

pathDefaults:
  recordFormat: fmp4
  recordPartDuration: 1s
  # NOT the 1h default. MediaMTX's reported timespan durations can disagree
  # with what is on disk, so shorter segments bound the error to ten minutes
  # (SPEC 8, item 4).
  recordSegmentDuration: 10m
  recordDeleteAfter: 168h # 7 days

paths:
  # Main stream: high resolution, recorded continuously, never watched
  # directly — so a viewer can never disturb the recording.
  #
  # This `source` is the real camera. Docker Compose overrides it to
  # `publisher` via MTX_PATHS_YARD_SOURCE so the fake camera can publish to
  # this same path — a path cannot both pull a source and accept a publisher.
  # See docker-compose.yml.
  yard:
    source: rtsp://192.168.1.50:5543/<md5-of-onvif-password>/live/channel0
    sourceOnDemand: no # must record whether or not anyone is watching
    record: yes
    recordPath: ./recordings/%path/%Y-%m-%d_%H-%M-%S-%f

  # Sub-stream: low bitrate, H.264, pulled only while a browser is connected.
  # Live view reads this, so watching costs almost nothing.
  #
  # sourceOnDemand keeps this quiet in development: with no real camera it is
  # never dialled until something actually watches it, so it does not spam
  # connection errors the way a `no` would.
  yard_sub:
    source: rtsp://192.168.1.50:5543/<md5-of-onvif-password>/live/channel1
    sourceOnDemand: yes
    record: no

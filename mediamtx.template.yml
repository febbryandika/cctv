# Ronda media pipeline (docs/ARCHITECTURE.md#the-media-pipeline).
#
# MediaMTX owns the entire media path: it pulls RTSP from the camera, records
# fMP4 segments to disk, serves WebRTC/WHEP for live, and stitches recorded
# windows by wall-clock time. The application code owns only authentication,
# timeline arithmetic, and honesty about what was actually recorded.

# This is the TRACKED source. `cd apps/api && bun run render:mediamtx` renders
# it to mediamtx.yml, filling in CAMERA_RTSP_MAIN and CAMERA_RTSP_SUB from
# .env. The rendered file is gitignored because a stream URL is a credential:
# it carries either a password in userinfo or md5(password) in the path
# (docs/ARCHITECTURE.md#the-trust-boundary).

logLevel: info

# Binding these to 127.0.0.1 directly is the obvious reading. Inside a container
# that would make them unreachable through a published port, so the loopback
# guarantee moves one layer out: MediaMTX listens on all interfaces WITHIN its
# own network namespace, and docker-compose.yml publishes each port to 127.0.0.1
# only.
#
# The loopback property (docs/ARCHITECTURE.md#the-trust-boundary) is unchanged
# and if anything stronger — nothing outside this machine can reach a stream,
# and the container is network-isolated on top.
rtspAddress: :8554
webrtcAddress: :8889
apiAddress: :9997
playbackAddress: :9996

api: yes
playback: yes

# Every protocol this project does not use is turned off, not just left unbound.
# A MediaMTX at its defaults also serves RTMP on :1935, SRT on :8890 and MoQ on
# :8892-8893 — each a complete, unauthenticated way to read `yard`. `hls: no`
# was already specified for a different reason
# (docs/ARCHITECTURE.md#what-this-deliberately-does-not-do); the rest follow the
# same logic.
hls: no
rtmp: no
srt: no
moq: no

# TCP-only RTSP. This is the server setting, so it governs how `fakecam`
# publishes, not how the real camera is pulled (that is per-path rtspTransport
# and stays automatic). It removes the UDP/RTP and UDP/RTCP listeners on
# :8000-8001 entirely, so there are two fewer ports to publish and two fewer
# things listening.
rtspTransports: [tcp]

# WebRTC media does not flow through the API proxy — the browser talks to
# MediaMTX directly over ICE — so MediaMTX must advertise an address the
# browser can actually reach. From inside a container it would otherwise
# advertise the container's private IP, and live view would fail with no
# obvious cause. Advertise the published address instead.
webrtcIPsFromInterfaces: no
webrtcAdditionalHosts: [127.0.0.1]
webrtcLocalUDPAddress: :8189

# MediaMTX's default ACL allows the `api` action only from source IP 127.0.0.1,
# which cannot work behind a published port: the container runtime NATs every
# host connection to a gateway address (192.168.127.1 on a Podman/Docker
# Desktop VM, the bridge gateway on native Linux), so the control API answers
# "authentication error" for calls the Hono API is supposed to make.
#
# Naming those gateways here would be chasing a runtime implementation detail
# for no security: a gateway address covers ALL host traffic, so allowing it
# permits exactly what the published port already permits. The ACL cannot
# express "only this machine" from behind NAT.
#
# The boundary that DOES hold is the publish address — docker-compose.yml binds
# every port to 127.0.0.1, so nothing off this machine can reach them
# (docs/ARCHITECTURE.md#the-trust-boundary). That `127.0.0.1:` prefix is
# load-bearing; dropping it exposes the control API to the LAN. If these ports
# ever need a wider bind, give this user a real password rather than widening
# the IP list.
authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: publish
      - action: read
      - action: playback
  - user: any
    pass:
    ips: []
    permissions:
      - action: api
      - action: metrics
      - action: pprof

pathDefaults:
  recordFormat: fmp4
  recordPartDuration: 1s
  # NOT the 1h default. MediaMTX's reported timespan durations can disagree with
  # what is on disk, so shorter segments bound the error to ten minutes
  # (docs/ARCHITECTURE.md#timeline-gaps-and-coverage, item 4).
  recordSegmentDuration: 10m
  # Time-based, per path, and there is no global size cap: MediaMTX deletes by
  # age, never under disk pressure. With N cameras on one disk this number is
  # multiplied by N, so it is a variable rather than a literal — and it is set
  # from a measured bytesPerHour off /health, never from a datasheet
  # (docs/ARCHITECTURE.md#observability).
  recordDeleteAfter: ${RECORD_DELETE_AFTER}

# Two paths per camera, GENERATED — the block below is emitted by renderPaths()
# in apps/api/src/camera.ts from CAMERAS and the CAMERA_<SLUG>_RTSP_* variables
# in .env. Adding a camera is an .env edit and a re-render, never an edit here.
#
#   <slug>       main stream: high resolution, recorded continuously, never
#                watched directly, sourceOnDemand: no — so a viewer can never
#                disturb the recording.
#   <slug>_sub   sub-stream: low bitrate, H.264, sourceOnDemand: yes — pulled
#                only while a browser is connected. Live view reads this, so
#                watching costs almost nothing.
#
# The sources are rendered in rather than overridden by MTX_PATHS_* variables,
# and that is not a style choice: MediaMTX splits path names on `_`, so
# MTX_PATHS_YARD_SUB_SOURCE is read as path `yard` key `sub_source` and silently
# dropped. Verified against v1.20.1 — an equivalent `yardsub` path takes the
# override and `yard_sub` does not, and neither `__` nor lowercase escapes it.
# Rendering every source from one place removes that trap from the operator's
# path entirely, and leaves .env as the only thing that decides where a camera
# points.
#
# A camera with no hardware yet is declared by setting its CAMERA_<SLUG>_RTSP_MAIN
# to `publisher`, which lets the matching fakecam service publish to it. Point
# its CAMERA_<SLUG>_RTSP_SUB at rtsp://localhost:8554/<slug> and MediaMTX relays
# its own main path on demand: live view then has something to show with no
# camera, no second ffmpeg and no transcode.
paths:
${CAMERA_PATHS}
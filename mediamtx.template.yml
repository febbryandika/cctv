# Ronda media pipeline (SPEC 7).
#
# MediaMTX owns the entire media path: it pulls RTSP from the camera, records
# fMP4 segments to disk, serves WebRTC/WHEP for live, and stitches recorded
# windows by wall-clock time. The application code owns only authentication,
# timeline arithmetic, and honesty about what was actually recorded.

# This is the TRACKED source. `cd apps/api && bun run render:mediamtx` renders
# it to mediamtx.yml, filling in ${CAMERA_IP} and ${ONVIF_PASSWORD_MD5} from
# .env. The rendered file is gitignored because that hash is a password hash
# (SPEC 15).

logLevel: info

# SPEC 7 binds these to 127.0.0.1 directly. Inside a container that would make
# them unreachable through a published port, so the loopback guarantee moves
# one layer out: MediaMTX listens on all interfaces WITHIN its own network
# namespace, and docker-compose.yml publishes each port to 127.0.0.1 only.
#
# The SPEC 15 property is unchanged and if anything stronger — nothing outside
# this machine can reach a stream, and the container is network-isolated on top.
rtspAddress: :8554
webrtcAddress: :8889
apiAddress: :9997
playbackAddress: :9996

api: yes
playback: yes

# Every protocol this project does not use is turned off, not just left
# unbound. A MediaMTX at its defaults also serves RTMP on :1935, SRT on :8890
# and MoQ on :8892-8893 — each a complete, unauthenticated way to read `yard`.
# `hls: no` was already specified for a different reason (SPEC 1.3); the rest
# follow the same logic.
hls: no
rtmp: no
srt: no
moq: no

# TCP-only RTSP. This is the server setting, so it governs how `fakecam`
# publishes, not how the real camera is pulled (that is per-path rtspTransport
# and stays automatic). It removes the UDP/RTP and UDP/RTCP listeners on
# :8000-8001 entirely, so there are two fewer ports to publish and two fewer
# things listening.
rtspTransports: [tcp]

# WebRTC media does not flow through the API proxy — the browser talks to
# MediaMTX directly over ICE — so MediaMTX must advertise an address the
# browser can actually reach. From inside a container it would otherwise
# advertise the container's private IP, and live view would fail with no
# obvious cause. Advertise the published address instead.
webrtcIPsFromInterfaces: no
webrtcAdditionalHosts: [127.0.0.1]
webrtcLocalUDPAddress: :8189

# MediaMTX's default ACL allows the `api` action only from source IP 127.0.0.1,
# which cannot work behind a published port: the container runtime NATs every
# host connection to a gateway address (192.168.127.1 on a Podman/Docker
# Desktop VM, the bridge gateway on native Linux), so the control API answers
# "authentication error" for calls the Hono API is supposed to make.
#
# Naming those gateways here would be chasing a runtime implementation detail
# for no security: a gateway address covers ALL host traffic, so allowing it
# permits exactly what the published port already permits. The ACL cannot
# express "only this machine" from behind NAT.
#
# The boundary that DOES hold is the publish address — docker-compose.yml binds
# every port to 127.0.0.1, so nothing off this machine can reach them (SPEC 15).
# That `127.0.0.1:` prefix is load-bearing; dropping it exposes the control API
# to the LAN. If these ports ever need a wider bind, give this user a real
# password rather than widening the IP list.
authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: publish
      - action: read
      - action: playback
  - user: any
    pass:
    ips: []
    permissions:
      - action: api
      - action: metrics
      - action: pprof

pathDefaults:
  recordFormat: fmp4
  recordPartDuration: 1s
  # NOT the 1h default. MediaMTX's reported timespan durations can disagree
  # with what is on disk, so shorter segments bound the error to ten minutes
  # (SPEC 8, item 4).
  recordSegmentDuration: 10m
  recordDeleteAfter: 168h # 7 days

paths:
  # Main stream: high resolution, recorded continuously, never watched
  # directly — so a viewer can never disturb the recording.
  #
  # This `source` is the real camera. Docker Compose overrides it to
  # `publisher` via MTX_PATHS_YARD_SOURCE so the fake camera can publish to
  # this same path — a path cannot both pull a source and accept a publisher.
  yard:
    source: rtsp://${CAMERA_IP}:5543/${ONVIF_PASSWORD_MD5}/live/channel0
    sourceOnDemand: no # must record whether or not anyone is watching
    record: yes
    recordPath: ./recordings/%path/%Y-%m-%d_%H-%M-%S-%f

  # Sub-stream: low bitrate, H.264, pulled only while a browser is connected.
  # Live view reads this, so watching costs almost nothing.
  #
  # sourceOnDemand keeps this quiet in development: it is never dialled until
  # something actually watches it, so it does not spam connection errors the way
  # a `no` would.
  #
  # This source is a token, unlike `yard` above, because development has no
  # camera to pull channel1 from and fakecam only feeds `yard`. It cannot be
  # overridden the way `yard` is: an MTX_PATHS_* variable cannot address a path
  # whose name contains an underscore, so MTX_PATHS_YARD_SUB_SOURCE is read as
  # path `yard` key `sub_source` and silently dropped. The substitution is done
  # by render-mediamtx.ts instead, which explains it at more length.
  #
  # Unset YARD_SUB_SOURCE renders exactly the line this replaced — the same
  # camera URL as `yard` above, on channel1 instead of channel0. (Spelled out
  # rather than written as a token: the renderer substitutes comments too, and
  # repeating the hash here would put it in the generated file twice.)
  # .env.example sets it to rtsp://localhost:8554/yard, so MediaMTX relays its
  # own main path on demand and live view has something to show with no camera.
  yard_sub:
    source: ${YARD_SUB_SOURCE}
    sourceOnDemand: yes
    record: no
